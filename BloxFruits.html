<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Paradise - Blox Fruits</title>
    <link rel="icon" type="image/webp" href="PP.webp">
    <style>

        * {
            box-sizing: border-box;
        }

        body {
            background:
                linear-gradient(
                    to bottom,
                    #d6b77c 0%,
                    #b8925b 35%,
                    #765333 70%,
                    #24180f 100%
                );

            color: white;

            min-height: 100vh;
            margin: 0;

            font-family: Arial, sans-serif;
        }


        /* =========================
           MAIN PAGE
        ========================= */

        .container {
            width: 90%;
            max-width: 1200px;

            margin: 0 auto;

            padding-top: 70px;
            padding-bottom: 70px;

            text-align: center;
        }


        /* =========================
           TOP HERO BOX
        ========================= */

        .hero-box {
            width: 100%;

            background:
                linear-gradient(
                    135deg,
                    #5f4025,
                    #8b5a2b,
                    #c3914c
                );

            border: 2px solid #d6ad60;

            border-radius: 28px;

            padding: 55px 30px;

            position: relative;

            overflow: hidden;

            box-shadow:
                0 12px 30px rgba(0, 0, 0, 0.35),
                inset 0 1px 0 rgba(255, 255, 255, 0.15);
        }


        /* Decorative shine */
        .hero-box::before {
            content: "";

            position: absolute;

            width: 450px;
            height: 450px;

            top: -300px;
            right: 80px;

            background:
                rgba(255, 220, 150, 0.09);

            transform: rotate(45deg);
        }


        .hero-box::after {
            content: "";

            position: absolute;

            width: 300px;
            height: 300px;

            bottom: -230px;
            left: 80px;

            background:
                rgba(255, 255, 255, 0.04);

            transform: rotate(45deg);
        }


        /* =========================
           HERO TEXT
        ========================= */

        .hero-box h1 {
            position: relative;
            z-index: 2;

            font-size: 52px;

            margin:
                0 0 15px 0;

            text-shadow:
                0 4px 8px
                rgba(0, 0, 0, 0.5);
        }


        .hero-box p {
            position: relative;
            z-index: 2;

            margin: 0;

            color: #f7ead4;

            font-size: 20px;

            font-weight: 600;
        }


        /* =========================
           SECTION TITLE
        ========================= */

        .section-title {
            margin-top: 45px;

            font-size: 25px;

            font-weight: bold;

            color: #f7ead4;
        }


        .section-description {
            margin:
                8px auto 30px;

            color: #ead8bc;

            font-size: 16px;
        }


        /* =========================
           MENU GRID
        ========================= */

        .menu-grid {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 25px;

            max-width: 850px;

            margin: 0 auto;
        }


        /* =========================
           MENU CARDS
        ========================= */

        .menu-card {
            position: relative;

            min-height: 220px;

            padding: 35px;

            border-radius: 22px;

            border:
                2px solid
                #c9944c;

            cursor: pointer;

            overflow: hidden;

            display: flex;

            flex-direction: column;

            justify-content: flex-end;

            text-align: left;

            background:
                linear-gradient(
                    145deg,
                    #4a301c,
                    #704824,
                    #98632f
                );

            box-shadow:
                0 12px 25px
                rgba(0, 0, 0, 0.35);

            transition:
                transform 0.25s,
                box-shadow 0.25s,
                border-color 0.25s;
        }


        /* Card shine */
        .menu-card::before {
            content: "";

            position: absolute;

            width: 250px;
            height: 250px;

            top: -170px;
            right: -60px;

            transform: rotate(45deg);

            background:
                rgba(255, 210, 120, 0.08);

            transition: 0.25s;
        }


        /* =========================
           CARD HOVER
        ========================= */

        .menu-card:hover {
            transform:
                translateY(-6px);

            border-color:
                #e3ba6c;

            box-shadow:
                0 18px 35px
                rgba(0, 0, 0, 0.45);
        }


        .menu-card:hover::before {
            background:
                rgba(255, 220, 150, 0.14);
        }


        /* =========================
           ICON
        ========================= */

        .card-icon {
            position: absolute;

            top: 28px;
            left: 32px;

            font-size: 42px;

            filter:
                drop-shadow(
                    0 4px 4px
                    rgba(0, 0, 0, 0.35)
                );
        }


        /* =========================
           CARD TEXT
        ========================= */

        .menu-card h2 {
            position: relative;

            z-index: 2;

            margin:
                0 0 8px 0;

            font-size: 29px;

            color: white;
        }


        .menu-card p {
            position: relative;

            z-index: 2;

            margin: 0;

            line-height: 1.5;

            color: #f0dcc0;

            font-size: 15px;
        }


        /* =========================
           ARROW
        ========================= */

        .arrow {
            position: absolute;

            z-index: 2;

            right: 20px;
            bottom: 12px;

            font-size: 27px;

            color: #e8bd6c;

            transition:
                transform 0.25s;
        }


        .menu-card:hover .arrow {
            transform:
                translateX(5px);
        }


        /* =========================
           BACK BUTTON
        ========================= */

        .back-button {
            margin-top: 40px;

            background:
                #6f4726;

            color: white;

            border:
                2px solid
                #c9944c;

            padding:
                12px 24px;

            border-radius:
                10px;

            font-size:
                16px;

            font-weight:
                bold;

            cursor:
                pointer;

            transition:
                0.2s;
        }


        .back-button:hover {
            background:
                #8b5a2b;

            transform:
                translateY(-2px);

            box-shadow:
                0 8px 18px
                rgba(0, 0, 0, 0.3);
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            .container {
                padding-top: 35px;
            }


            .hero-box {
                padding:
                    40px 20px;
            }


            .hero-box h1 {
                font-size:
                    36px;
            }


            .hero-box p {
                font-size:
                    17px;
            }


            .menu-grid {
                grid-template-columns:
                    1fr;
            }


            .menu-card {
                min-height:
                    190px;

                padding:
                    28px;
            }


            .card-icon {
                left: 27px;

                top: 25px;

                font-size:
                    36px;
            }


            .menu-card h2 {
                font-size:
                    25px;
            }
        }

    </style>

</head>


<body>


    <div class="container">


        <!-- =========================
             HERO
        ========================== -->

        <div class="hero-box">

            <h1>
                Paradise Blox Fruits
            </h1>

            <p>
                Your Blox Fruits hub in Pirate's Paradise.
            </p>

        </div>


        <!-- =========================
             MENU TITLE
        ========================== -->

        <div class="section-title">
            What are you looking for?
        </div>

        <div class="section-description">
            Check the latest stock or search item values.
        </div>


        <!-- =========================
             MENU CARDS
        ========================== -->

        <div class="menu-grid">


            <!-- STOCK CARD -->

            <div
                class="menu-card"
                onclick="window.location.href='Stock.html'"
            >

                <div class="card-icon">
                    📋
                </div>

                <h2>
                    Fruit Stock
                </h2>

                <p>
                    Check which fruits are currently available in stock.
                     
                </p>

                <div class="arrow">
                    →
                </div>

            </div>


            <!-- VALUES CARD -->

            <div
                class="menu-card"
                onclick="window.location.href='Values.html'"
            >

                <div class="card-icon">
                    💰
                </div>

                <h2>
                    Fruit Values
                </h2>

                <p>
                    Search fruit values, demand, prices and other information.
                </p>

                <div class="arrow">
                    →
                </div>

            </div>


        </div>


        <!-- =========================
             BACK BUTTON
        ========================== -->

        <button
            class="back-button"
            onclick="window.location.href='index.html'"
        >
            ← Back to Pirate's Paradise
        </button>


    </div>


</body>

</html>
