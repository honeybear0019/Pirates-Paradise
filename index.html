<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pirate's Paradise</title>
    <link rel="icon" type="image/webp" href="PP.webp">
    <style>

        body {
            background:
                linear-gradient(
                    to bottom,
                    #d6b77c 0%,
                    #b8925b 35%,
                    #765333 70%,
                    #24180f 100%
                );

            color: white;

            display: flex;
            flex-direction: column;
            align-items: center;

            min-height: 100vh;
            margin: 0;

            font-family: Arial, sans-serif;
        }


        /* =========================
           MAIN CONTENT
        ========================= */

        .container {
            width: 95%;
            max-width: 1500px;

            margin-top: 80px;
            margin-bottom: 80px;

            text-align: center;
        }


        /* =========================
           PIRATE'S PARADISE BOX
        ========================= */

        .welcome-box {

            width: 100%;
            box-sizing: border-box;

            background:
                linear-gradient(
                    135deg,
                    #5f4025,
                    #8b5a2b,
                    #c3914c
                );

            border: 2px solid #d6ad60;

            border-radius: 28px;

            padding: 55px 30px;

            box-shadow:
                0 12px 30px rgba(0, 0, 0, 0.35),
                inset 0 1px 0 rgba(255, 255, 255, 0.15);

            position: relative;

            overflow: hidden;
        }


        /* SUBTLE SHINE INSIDE BOX */

        .welcome-box::before {

            content: "";

            position: absolute;

            width: 400px;
            height: 400px;

            background:
                rgba(255, 220, 150, 0.08);

            transform: rotate(45deg);

            top: -250px;
            right: 100px;
        }


        /* =========================
           MAIN TITLE
        ========================= */

        .welcome-box h1 {

            position: relative;

            font-size: 52px;

            margin: 0 0 20px 0;

            text-shadow:
                0 4px 8px rgba(0, 0, 0, 0.5);
        }


        /* WELCOME TEXT */

        .welcome-box p {

            position: relative;

            font-size: 22px;

            margin: 0;

            color: #f7ead4;

            font-weight: 600;
        }


        /* =========================
           CHOOSE YOUR ADVENTURE
        ========================= */

        .section-title {

            margin-top: 50px;

            font-size: 26px;

            color: #f7ead4;

            font-weight: bold;

            text-shadow:
                0 3px 6px rgba(0, 0, 0, 0.3);
        }


        /* =========================
           BLOX FRUITS GAME CARD
        ========================= */

        .game-card {

            width: 75%;
            max-width: 850px;

            height: 260px;

            margin: 25px auto 0;

            position: relative;

            border-radius: 24px;

            overflow: hidden;

            border: 2px solid #d6ad60;

            cursor: pointer;

            box-shadow:
                0 14px 30px rgba(0, 0, 0, 0.4);

            transition:
                transform 0.25s,
                box-shadow 0.25s;
        }


        /* GAME CARD HOVER */

        .game-card:hover {

            transform:
                translateY(-5px)
                scale(1.01);

            box-shadow:
                0 18px 40px rgba(0, 0, 0, 0.5);
        }


        /* =========================
           VIDEO BACKGROUND
        ========================= */

        .game-card video {

            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;
        }


        /* =========================
           DARK VIDEO OVERLAY
        ========================= */

        .game-card::after {

            content: "";

            position: absolute;

            inset: 0;

            background:
                linear-gradient(
                    to top,
                    rgba(0, 0, 0, 0.85),
                    rgba(0, 0, 0, 0.35),
                    rgba(0, 0, 0, 0.05)
                );

            z-index: 1;
        }


        /* =========================
           TEXT ON VIDEO
        ========================= */

        .game-card-content {

            position: absolute;

            z-index: 2;

            bottom: 30px;
            left: 35px;

            text-align: left;
        }


        /* BLOX FRUITS TITLE */

        .game-card-content h2 {

            margin: 0;

            font-size: 34px;

            text-shadow:
                0 4px 10px rgba(0, 0, 0, 0.8);
        }


        /* BLOX FRUITS DESCRIPTION */

        .game-card-content p {

            margin: 8px 0 0;

            color: #f7ead4;

            font-size: 17px;

            text-shadow:
                0 3px 6px rgba(0, 0, 0, 0.8);
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .container {

                width: 92%;

                margin-top: 40px;
            }


            .welcome-box {

                padding: 40px 20px;

                border-radius: 20px;
            }


            .welcome-box h1 {

                font-size: 36px;
            }


            .welcome-box p {

                font-size: 18px;
            }


            .section-title {

                font-size: 22px;

                margin-top: 40px;
            }


            .game-card {

                width: 95%;

                height: 210px;

                border-radius: 18px;
            }


            .game-card-content {

                left: 20px;
                bottom: 20px;

                right: 20px;
            }


            .game-card-content h2 {

                font-size: 27px;
            }


            .game-card-content p {

                font-size: 15px;
            }

        }

    </style>

</head>


<body>


    <div class="container">


        <!-- =====================
             MAIN WELCOME BOX
        ====================== -->

        <div class="welcome-box">

            <h1>
                Pirate's Paradise
            </h1>

            <p>
                Welcome to Pirate's Paradise!
            </p>

        </div>



        <!-- =====================
             SECTION TITLE
        ====================== -->

        <div class="section-title">

            Choose Your Adventure

        </div>



        <!-- =====================
             BLOX FRUITS VIDEO CARD
        ====================== -->

        <div
            class="game-card"
            onclick="window.location.href='BloxFruits.html'"
        >


            <!-- VIDEO -->

            <video
                autoplay
                muted
                loop
                playsinline
            >

                <source
                    src="bloxfruits.mp4"
                    type="video/mp4"
                >

            </video>



            <!-- TEXT -->

            <div class="game-card-content">

                <h2>
                    Blox Fruits
                </h2>

                <p>
                    Check values and Stock for Blox Fruits!
                </p>

            </div>


        </div>


    </div>

/* =========================
   DISCORD FLOATING BOX
========================= */
<style>
/* =========================
   DISCORD FLOATING BOX
========================= */

.discord-invite {
    position: fixed;

    left: 22px;
    bottom: 22px;

    z-index: 9999;

    width: 300px;
    box-sizing: border-box;

    background:
        linear-gradient(
            135deg,
            #5865F2,
            #404EED
        );

    border: 2px solid rgba(255, 255, 255, 0.25);

    border-radius: 16px;

    padding: 16px 18px;

    display: flex;
    align-items: center;
    gap: 13px;

    color: white;
    text-decoration: none;

    box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.45);

    transition:
        transform 0.2s,
        box-shadow 0.2s,
        background 0.2s;
}


.discord-invite:hover {
    transform: translateY(-4px);

    background:
        linear-gradient(
            135deg,
            #6673ff,
            #5865F2
        );

    box-shadow:
        0 15px 35px rgba(0, 0, 0, 0.55);
}


.discord-icon {
    width: 45px;
    height: 45px;

    flex-shrink: 0;

    display: flex;
    justify-content: center;
    align-items: center;

    background: rgba(0, 0, 0, 0.18);

    border-radius: 12px;

    font-size: 23px;
}


.discord-text {
    text-align: left;
}


.discord-text strong {
    display: block;

    color: white;

    font-size: 17px;

    margin-bottom: 4px;
}


.discord-text span {
    display: block;

    color: rgba(255, 255, 255, 0.82);

    font-size: 12px;

    line-height: 1.3;
}


@media (max-width: 600px) {

    .discord-invite {
        left: 12px;
        bottom: 12px;

        width: 240px;

        padding: 12px 14px;
    }


    .discord-icon {
        width: 40px;
        height: 40px;
    }


    .discord-text strong {
        font-size: 15px;
    }


    .discord-text span {
        font-size: 11px;
    }
}
    </style>

</body>

</html>
