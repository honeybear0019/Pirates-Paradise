                    255,
                    255,
                    0.15
                );
        }


        .values-header::before {
            content: "";

            position: absolute;

            width: 420px;
            height: 420px;

            right: 80px;
            top: -300px;

            background:
                rgba(
                    255,
                    220,
                    150,
                    0.08
                );

            transform:
                rotate(45deg);
        }


        .values-header::after {
            content: "";

            position: absolute;

            width: 280px;
            height: 280px;

            left: 70px;
            bottom: -230px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.04
                );

            transform:
                rotate(45deg);
        }


        .values-header h1 {
            position: relative;

            text-shadow:

                    0,
                    0,
                    0,
                    0.5
                );
        }


        .values-header p {
            position: relative;

            z-index: 2;

            margin: 0;

            font-size: 18px;

            color:
                #f7ead4;

            font-weight: 600;
        }


        /* =========================
           TRADE CALCULATOR BUTTON
        ========================= */

            width: 100%;

            display: flex;

            justify-content: center;

            margin-top: 25px;

            margin-bottom: 5px;
        }

            padding:
                14px 28px;

            background:
                linear-gradient(
                    135deg,
                    #8b5a2b,
                    #b47a36
                );

            color: white;

            border:
                2px solid
                #d6ad60;

            border-radius:
                12px;

            font-size:
                17px;

            font-weight:
                bold;

            cursor:
                pointer;

            box-shadow:
                0 8px 20px
                rgba(
                    0,
                    0,
                    0,
                    0.3
                );

            transition:
                transform 0.2s,
                box-shadow 0.2s,
                background 0.2s;
        }


        .trade-calculator-button:hover {
            transform:
                translateY(-3px);

            background:
                linear-gradient(
                    135deg,
                    #a66b32,
                    #c58a43
                );

            box-shadow:
                0 12px 26px
                rgba(
                    0,
                    0,
                    0,
                    0.4
                );
        }


        .trade-calculator-button:active {
            transform:

        }

           SEARCH PANEL
        ========================= */

            text-align: center;

            background:
                rgba(

                    48,
                    28,
                    0.82

            border:
                2px solid
                #c9944c;

            border-radius:
                22px;

            box-shadow:
                0 12px 25px
                rgba(
                    0,
                    0,
                    0,
                    0.32
                );

            backdrop-filter:

            margin:
                0 0 8px;

            font-size:
                29px;
        }


        .search-description {

                0 0 25px;

            color:
                #ead8bc;

            font-size:
                15px;
        }

           SEARCH BAR
        ========================= */

            color: white;

                2px solid
                #8f6237;

            border-radius:
                10px;

            font-size:
                17px;

            outline: none;

            transition:

        }

                    181,
                    104,
                    0.15

            color:
                #c8b69d;
        }

            background:
                #8b5a2b;

            color: white;

            border:
                2px solid
                #c9944c;

            padding:
                13px 23px;

            border-radius:
                10px;

            font-size:
                17px;

            font-weight:
                bold;

            cursor:
                pointer;

            transition:
                0.2s;

                    0,
                    0,
                    0,
                    0.3

                    150,

                    15px;

</head>

/* ================================
   CHECK VALUE
================================ */


function checkValue() {

    let search = document
        .getElementById("fruitInput")
        .value
        .toLowerCase()
        .trim();


    if (search === "") {

        document
            .getElementById("result")
            .innerHTML = `

                <p class="not-found">
                    Please enter an item name.
                </p>

            `;

        return;
    }


    /* ================================
       USE ALIASES
    ================================ */

    if (aliases[search]) {

        search =
            aliases[search];
    }


    /* ================================
       DRAGON SELECTOR
    ================================ */

    if (search === "dragon") {

        document
            .getElementById("result")
            .innerHTML = `

                <div class="result-card">

                    <h3>
                        Which Dragon?
                    </h3>

                    <p class="suggestion">
                        Choose the version you want to check.
                    </p>


                    <div class="dragon-options">

                        <button
                            class="dragon-choice"
                            onclick="chooseDragon('east dragon')"
                        >
                            East Dragon
                        </button>


                        <button
                            class="dragon-choice"
                            onclick="chooseDragon('west dragon')"
                        >
                            West Dragon
                        </button>

                    </div>

                </div>

            `;

        return;
    }


    /* ================================
       EXACT MATCH
    ================================ */

    if (items[search]) {

        showResult(
            search,
            items[search]
        );

        return;
    }


    /* ================================
       TYPO MATCHING
    ================================ */

    const names =
        Object.keys(items);


    let closestName =
        null;


    let smallestDistance =
        Infinity;


    for (const name of names) {

        const distance =
            levenshteinDistance(
                search,
                name
            );


        if (
            distance <
            smallestDistance
        ) {

            smallestDistance =
                distance;

            closestName =
                name;
        }
    }


    let allowedMistakes =
        2;


    if (
        search.length >= 10
    ) {

        allowedMistakes =
            3;
    }


    if (
        smallestDistance <=
        allowedMistakes
    ) {

        showResult(
            closestName,
            items[closestName],
            search
        );

    } else {

        document
            .getElementById("result")
            .innerHTML = `

                <p class="not-found">
                    Item not found.
                </p>

            `;
    }
}



/* ================================
   DRAGON CHOICE
================================ */


function chooseDragon(
    dragonName
) {

    document
        .getElementById("fruitInput")
        .value = dragonName;


    checkValue();
}

================================ */


function showResult(

) {

    if (item.image) {

                alt="${formatName(name)}"

                onerror="this.style.display='none'"
            >

    /* ================================

    ================================ */

    if (

    ) {

            <div class="info-row">

                </span>

                <strong class="permanent-value">

                    ${formatValue(
                        item.permanentValue
                    )}

                </strong>

            </div>

        `;
    }


    /* ================================

    ================================ */

    let fruitPriceHTML =
        "";


    if (
        item.category === "fruit"
    ) {

        fruitPriceHTML = `

            <div class="info-row">

                <span class="label">
                    Beli Price
                </span>

                <strong class="price">

                    ${formatBeliPrice(
                        item.price
                    )}

                </strong>

            </div>


            <div class="info-row">

                <span class="label">
                    Permanent Price
                </span>

                <strong class="robux-price">

                    ${formatRobuxPrice(
                        item.robuxPrice
                    )}

                </strong>

            </div>


            <div class="info-row">

                <span class="label">
                    Fruit Type
                </span>

                <strong class="fruit-type">
                    ${item.fruitType}
                </strong>

            </div>

        `;
    }


    /* ================================
       LIMITED / GAMEPASS PRICE
    ================================ */

    let specialPriceHTML =
        "";


    if (
        item.category !== "fruit"
    ) {

        specialPriceHTML = `

            <div class="info-row">

                <span class="label">
                    Price
                </span>

                <strong class="price">

                    ${formatSpecialPrice(
                        item.price,
                        item.priceType
                    )}

                </strong>

            </div>

        `;
    }


    /* ================================
       DEMAND DISPLAY
    ================================ */

    let demandDisplay =
        item.demand;


    if (
        item.demandType &&
        item.demandType !== "N/A"
    ) {

        demandDisplay =
            item.demand +
            " - " +
            item.demandType;
    }


    /* ================================
       RESULT CARD
    ================================ */

    result.innerHTML = `

        ${suggestion}


        <div class="result-card">


            ${imageHTML}


            <h3>
                ${formatName(name)}
            </h3>


            <div class="item-info">


                <!-- PHYSICAL VALUE -->

                <div class="info-row">

                    <span class="label">
                        Physical Value
                    </span>

                    <strong class="physical-value">

                        ${formatValue(
                            item.value
                        )}

                    </strong>

                </div>


                <!-- PERMANENT VALUE -->

                ${permanentValueHTML}


                <!-- DEMAND -->

                <div class="info-row">

                    <span class="label">
                        Demand
                    </span>

                    <strong class="demand">
                        ${demandDisplay}
                    </strong>

                </div>


                <!-- NORMAL FRUIT PRICES -->

                ${fruitPriceHTML}


                <!-- LIMITED / GAMEPASS PRICE -->

                ${specialPriceHTML}


            </div>


        </div>

    `;
}



/* ================================
   FORMAT VALUE
================================ */


function formatValue(
    value
) {

    if (
        value === "N/A"
        ||
        value === undefined
        ||
        value === null
    ) {

        return "N/A";
    }


    /* BILLIONS */

    if (
        value >=
        1000000000
    ) {

        return (
            value /
            1000000000
        )
        .toFixed(2)
        .replace(
            /\.?0+$/,
            ""
        )
        + "B";
    }


    /* MILLIONS */

    if (
        value >=
        1000000
    ) {

        return (
            value /
            1000000
        )
        .toFixed(2)
        .replace(
            /\.?0+$/,
            ""
        )
        + "M";
    }


    /* THOUSANDS */

    if (
        value >=
        1000
    ) {

        return (
            value /
            1000
        )
        .toFixed(1)
        .replace(
            /\.0$/,
            ""
        )
        + "K";
    }


    return value;
}



/* ================================
   FORMAT BELI PRICE
================================ */


function formatBeliPrice(
    price
) {

    if (
        price === "N/A"
        ||
        price === undefined
        ||
        price === null
    ) {

        return "N/A";
    }


    return (
        "$" +
        Number(price)
            .toLocaleString()
    );
}



/* ================================
   FORMAT PERMANENT ROBUX PRICE
================================ */


function formatRobuxPrice(
    price
) {

    if (
        price === "N/A"
        ||
        price === undefined
        ||
        price === null
    ) {

        return "N/A";
    }


    return (
        "R$ " +
        Number(price)
            .toLocaleString()
    );
}



/* ================================
   FORMAT SPECIAL ITEM PRICE
================================ */


function formatSpecialPrice(
    price,
    type
) {

    if (
        price === "N/A"
        ||
        price === undefined
        ||
        price === null
    ) {

        return "N/A";
    }


    if (
        typeof price ===
        "string"
    ) {

        return price;
    }


    if (
        type === "Robux"
    ) {

        return (
            "R$ " +
            Number(price)
                .toLocaleString()
        );
    }


    if (
        type === "Beli"
    ) {

        return (
            "$" +
            Number(price)
                .toLocaleString()
        );
    }


    return (
        Number(price)
            .toLocaleString()
    );
}



/* ================================
   FORMAT NAME
================================ */


function formatName(
    name
) {

    return name

        .split(" ")

        .map(

            word =>

                word
                    .charAt(0)
                    .toUpperCase()

                +

                word.slice(1)

        )

        .join(" ");
}



/* ================================
   LEVENSHTEIN TYPO MATCHING
================================ */


function levenshteinDistance(
    a,
    b
) {

    const matrix =
        [];


    for (
        let i = 0;
        i <= b.length;
        i++
    ) {

        matrix[i] =
            [i];
    }


    for (
        let j = 0;
        j <= a.length;
        j++
    ) {

        matrix[0][j] =
            j;
    }


    for (
        let i = 1;
        i <= b.length;
        i++
    ) {

        for (
            let j = 1;
            j <= a.length;
            j++
        ) {

            if (
                b.charAt(i - 1)
                ===
                a.charAt(j - 1)
            ) {

                matrix[i][j] =
                    matrix[i - 1]
                          [j - 1];

            } else {

                matrix[i][j] =
                    Math.min(

                        matrix[i - 1]
                              [j - 1]
                        + 1,

                        matrix[i]
                              [j - 1]
                        + 1,

                        matrix[i - 1]
                              [j]
                        + 1

                    );
            }
        }
    }


    return (
        matrix[b.length]
              [a.length]
    );
}
